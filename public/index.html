<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Best Bingo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; user-select: none; }
        body { background-color: #0b111e; color: #ffffff; padding: 12px; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .btn-refresh { background: #162a45; color: #00d2ff; border: 1px solid #00d2ff; padding: 6px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .balance { color: #00ff66; font-weight: bold; font-size: 15px; }
        .banner-alert { background: #5c4400; color: #ffeb3b; padding: 6px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; }

        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
        .stat-card { background: #131c2e; padding: 8px 4px; border-radius: 8px; text-align: center; border: 1px solid #1f2c45; }
        .stat-label { font-size: 11px; color: #8a99ad; margin-bottom: 4px; }
        .stat-value { font-size: 14px; font-weight: bold; color: #ffffff; }

        .nav-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .nav-btn { background: #131c2e; color: #8a99ad; padding: 10px; border: 1px solid #1f2c45; border-radius: 8px; font-weight: bold; text-align: center; cursor: pointer; }
        .nav-btn.active { background: #0088cc; color: #ffffff; border-color: #0088cc; }
        .nav-btn.hidden { display: none; }

        .status-banner { background: #0f2438; border: 1px solid #0088cc; text-align: center; padding: 10px; border-radius: 8px; font-weight: bold; color: #00d2ff; margin-bottom: 12px; font-size: 15px; }

        /* Ball Badge Styles */
        .call-display { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 12px; min-height: 48px; }
        .ball-badge { display: inline-flex; align-items: center; justify-content: center; padding: 10px 20px; border-radius: 25px; font-size: 20px; font-weight: bold; text-shadow: 1px 1px 2px #000; }
        
        .ball-B { background: #1b5e20; color: #ffffff; border: 2px solid #4caf50; } /* 🟢 B */
        .ball-I { background: #f57f17; color: #ffffff; border: 2px solid #ffeb3b; } /* 🟡 I */
        .ball-N { background: #b71c1c; color: #ffffff; border: 2px solid #f44336; } /* 🔴 N */
        .ball-G { background: #0d47a1; color: #ffffff; border: 2px solid #2196f3; } /* 🔵 G */
        .ball-O { background: #1b5e20; color: #ffffff; border: 2px solid #4caf50; } /* 🟢 O */

        /* Grids */
        .cards-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; background: #131c2e; padding: 8px; border-radius: 8px; }
        .card-item { background: #1c283d; border-radius: 4px; text-align: center; padding: 10px 0; font-size: 12px; font-weight: bold; color: #cbd5e1; cursor: pointer; }
        .card-item.selected { background: #0088cc; color: #fff; border: 1px solid #00d2ff; }
        .card-item.called { background: #1b5e20 !important; color: #00ff66 !important; border: 1px solid #00ff66; }

        /* Live Game 5x5 Matrix Layout */
        .bingo-board { display: none; background: #131c2e; padding: 10px; border-radius: 8px; margin-top: 10px; }
        .bingo-header { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; text-align: center; font-weight: bold; font-size: 18px; margin-bottom: 6px; }
        .bingo-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
        .bingo-cell { background: #1c283d; padding: 12px 0; border-radius: 4px; text-align: center; font-weight: bold; font-size: 14px; }
        .bingo-cell.marked { background: #1b5e20; color: #00ff66; border: 1px solid #00ff66; }
        .bingo-cell.free { background: #0088cc; color: #ffffff; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 99; }
        .modal-content { background: #131c2e; border: 2px solid #0088cc; padding: 24px; border-radius: 12px; text-align: center; max-width: 80%; }
        .modal-title { font-size: 20px; font-weight: bold; color: #00ff66; margin-bottom: 10px; }
        .modal-desc { font-size: 14px; color: #ffffff; margin-bottom: 15px; }
        .modal-btn { background: #0088cc; color: #fff; border: none; padding: 8px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="btn-refresh" onclick="fetchState()">REFRESH</button>
        <div class="balance">BALANCE: 0 ETB</div>
        <div class="banner-alert">ስአት ገላዉ 1000 ሶስ አ</div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-label">Derash</div>
            <div class="stat-value" id="ui-derash">0 ETB</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Players</div>
            <div class="stat-value" id="ui-players">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Stake</div>
            <div class="stat-value">10 ETB</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Call</div>
            <div class="stat-value" id="ui-call">0/75</div>
        </div>
    </div>

    <div class="nav-buttons">
        <div class="nav-btn active" id="tab-pick" onclick="switchTab('pick')">Pick Cards (1-500)</div>
        <div class="nav-btn" id="tab-live" onclick="switchTab('live')">Live Game</div>
    </div>

    <div class="status-banner" id="ui-status">Next Round in: 40s</div>

    <div class="call-display" id="ui-ball-container"></div>

    <!-- 1-100 Card Picker View -->
    <div class="cards-grid" id="ui-cards-container"></div>

    <!-- Live Game 5x5 Bingo Card View -->
    <div class="bingo-board" id="ui-bingo-board">
        <div class="bingo-header">
            <span style="color: #4caf50;">B</span>
            <span style="color: #ffeb3b;">I</span>
            <span style="color: #f44336;">N</span>
            <span style="color: #2196f3;">G</span>
            <span style="color: #4caf50;">O</span>
        </div>
        <div class="bingo-grid" id="ui-bingo-cells"></div>
    </div>

    <div class="modal" id="winner-modal">
        <div class="modal-content">
            <div class="modal-title">🎉 BINGO WINNER! 🎉</div>
            <div class="modal-desc" id="winner-text"></div>
            <button class="modal-btn" onclick="closeModal()">OK</button>
        </div>
    </div>

    <script>
        let currentTab = 'pick';
        let userSelectedCards = [];
        let playerBoard = [
            [5, 18, 33, 50, 62],
            [12, 22, 40, 55, 70],
            [9, 27, "FREE", 58, 68],
            [14, 21, 38, 52, 74],
            [2, 30, 44, 59, 61]
        ];

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-pick').classList.toggle('active', tab === 'pick');
            document.getElementById('tab-live').classList.toggle('active', tab === 'live');
            
            if (tab === 'pick') {
                document.getElementById('ui-cards-container').style.display = 'grid';
                document.getElementById('ui-bingo-board').style.display = 'none';
            } else {
                document.getElementById('ui-cards-container').style.display = 'none';
                document.getElementById('ui-bingo-board').style.display = 'block';
            }
        }

        function closeModal() {
            document.getElementById('winner-modal').style.display = 'none';
        }

        async function selectCard(cardId) {
            const res = await fetch('/api/game/select-card', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cardId })
            });
            const data = await res.json();
            if (data.success) {
                userSelectedCards = data.selectedCards;
                fetchState();
            }
        }

        async function fetchState() {
            try {
                const res = await fetch('/api/game/state');
                const data = await res.json();
                
                document.getElementById('ui-derash').innerText = `${data.derash} ETB`;
                document.getElementById('ui-players').innerText = data.playersCount;
                document.getElementById('ui-call').innerText = `${data.calledNumbers.length}/75`;

                const statusEl = document.getElementById('ui-status');
                const ballContainer = document.getElementById('ui-ball-container');
                const pickTab = document.getElementById('tab-pick');

                if (data.status === 'WAITING') {
                    statusEl.innerText = `Next Round in: ${data.timer}s`;
                    ballContainer.innerHTML = '';
                    pickTab.classList.remove('hidden');
                } else if (data.status === 'CALCULATING') {
                    statusEl.innerText = `Calculating Players... (${data.timer}s)`;
                    pickTab.classList.add('hidden');
                    if (currentTab !== 'live') switchTab('live');
                } else if (data.status === 'PLAYING') {
                    statusEl.innerText = `🎮 GAME IN PROGRESS`;
                    pickTab.classList.add('hidden');
                    if (currentTab !== 'live') switchTab('live');

                    if (data.currentBall) {
                        const ball = data.currentBall;
                        ballContainer.innerHTML = `
                            <div class="ball-badge ball-${ball.letter}">
                                ${ball.color} ${ball.letter}-${ball.number}
                            </div>
                        `;
                    }
                } else if (data.status === 'WINNER') {
                    statusEl.innerText = `🏆 ROUND FINISHED`;
                    if (data.winner) {
                        document.getElementById('winner-text').innerText = 
                            `Player: ${data.winner.player}\nCard ID: #${data.winner.cardId}\nPrize: ${data.winner.prize} ETB`;
                        document.getElementById('winner-modal').style.display = 'flex';
                    }
                }

                renderCardsGrid(data.calledNumbers);
                renderBingoBoard(data.calledNumbers);
            } catch (err) {
                console.error("Fetch state error:", err);
            }
        }

        function renderCardsGrid(calledNumbers = []) {
            const container = document.getElementById('ui-cards-container');
            container.innerHTML = '';
            for (let i = 1; i <= 100; i++) {
                const card = document.createElement('div');
                card.className = 'card-item';
                card.innerText = i;
                if (userSelectedCards.includes(i)) card.classList.add('selected');
                if (calledNumbers.includes(i)) card.classList.add('called');
                card.onclick = () => selectCard(i);
                container.appendChild(card);
            }
        }

        function renderBingoBoard(calledNumbers = []) {
            const container = document.getElementById('ui-bingo-cells');
            container.innerHTML = '';

            for (let r = 0; r < 5; r++) {
                for (let c = 0; c < 5; c++) {
                    const val = playerBoard[r][c];
                    const cell = document.createElement('div');
                    cell.className = 'bingo-cell';
                    cell.innerText = val;

                    if (val === 'FREE') {
                        cell.classList.add('free');
                    } else if (calledNumbers.includes(val)) {
                        cell.classList.add('marked');
                    }

                    container.appendChild(cell);
                }
            }
        }

        setInterval(fetchState, 1000);
        fetchState();
    </script>
</body>
</html>
