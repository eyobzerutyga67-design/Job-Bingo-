<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Job Bingo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-dark: #080d18;
            --card-bg: #111a2e;
            --border-color: #1e2d4a;
            --primary-blue: #0284c7;
            --cyan-accent: #00d8ff;
            --green-accent: #16a34a;
            --yellow-accent: #f59e0b;
            --red-accent: #dc2626;
            --purple-accent: #9333ea;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
        body { background-color: var(--bg-dark); color: #ffffff; padding: 6px; max-width: 480px; margin: 0 auto; overflow-x: hidden; }

        /* Splash Screen */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000000; z-index: 9999; display: flex; flex-direction: column;
            align-items: center; justify-content: center; transition: opacity 0.4s ease;
        }
        .splash-logo-container { text-align: center; margin-bottom: 25px; }
        .splash-crown { font-size: 3rem; margin-bottom: -10px; }
        .splash-title { font-size: 2.2rem; font-weight: 900; background: linear-gradient(180deg, #fef08a 0%, #eab308 50%, #ca8a04 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 20px rgba(234, 179, 8, 0.4); letter-spacing: 1px; }
        .splash-sub { color: #cbd5e1; font-size: 0.9rem; margin-top: 15px; font-weight: 600; }
        .splash-progress-bg { width: 180px; height: 5px; background: #1e293b; border-radius: 10px; overflow: hidden; margin-top: 12px; }
        .splash-progress-fill { width: 0%; height: 100%; background: var(--cyan-accent); transition: width 1.2s ease; }

        /* Top Navigation Header */
        .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.72rem; }
        .btn-refresh-sm { background: #0c2038; border: 1px solid var(--cyan-accent); color: var(--cyan-accent); padding: 4px 10px; border-radius: 12px; font-weight: 800; cursor: pointer; }
        .header-balance { color: #ffffff; font-weight: 800; }
        .header-balance span { color: #22c55e; }
        .header-amharic-badge { background: #332305; border: 1px solid #714b08; color: #fde047; padding: 4px 8px; border-radius: 12px; font-size: 0.65rem; font-weight: 700; }

        /* Status Header Bar */
        .status-header-bar { background: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; padding: 6px 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.75rem; font-weight: 800; }
        .status-conn { color: #22c55e; display: flex; align-items: center; gap: 4px; }
        .status-conn::before { content: ''; width: 8px; height: 8px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 6px #22c55e; }
        .status-timer { color: var(--yellow-accent); background: #1e1b06; padding: 2px 10px; border-radius: 10px; border: 1px solid #713f12; }
        .status-stake { color: var(--text-muted); }
        .status-stake span { color: var(--cyan-accent); }
        .status-win { color: #22c55e; }

        /* 500 Cards Picking Grid */
        .pick-grid-500 { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; max-height: calc(100vh - 150px); overflow-y: auto; padding: 4px; background: #050912; border: 1px solid var(--border-color); border-radius: 8px; }
        .pick-tile { background: #1e293b; color: #cbd5e1; border-radius: 4px; padding: 8px 0; text-align: center; font-size: 0.68rem; font-weight: 800; cursor: pointer; border: 1px solid #0f172a; }
        .pick-tile.selected { background: var(--red-accent) !important; color: #ffffff !important; border-color: #f87171 !important; box-shadow: 0 0 6px rgba(220, 38, 38, 0.6); }

        /* Live Game Section */
        .live-layout { display: flex; gap: 8px; margin-top: 4px; }
        
        /* Left 1-75 Vertical Matrix Board */
        .matrix-board-vertical { width: 140px; background: #0d1527; border: 1px solid var(--border-color); border-radius: 8px; padding: 4px; display: flex; flex-direction: column; gap: 2px; }
        .matrix-v-headers { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; text-align: center; font-weight: 900; font-size: 0.72rem; padding-bottom: 2px; }
        .mh-b { color: var(--yellow-accent); } .mh-i { color: var(--cyan-accent); } .mh-n { color: #f43f5e; } .mh-g { color: #22c55e; } .mh-o { color: var(--purple-accent); }
        
        .matrix-v-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
        .mv-cell { background: #1e293b; color: #64748b; font-size: 0.6rem; font-weight: 800; text-align: center; padding: 3px 0; border-radius: 2px; }
        .mv-cell.called { color: #ffffff; font-weight: 900; }
        .mv-cell.col-b.called { background: var(--red-accent); }
        .mv-cell.col-i.called { background: var(--primary-blue); }
        .mv-cell.col-n.called { background: var(--yellow-accent); color: #000; }
        .mv-cell.col-g.called { background: var(--green-accent); }
        .mv-cell.col-o.called { background: var(--purple-accent); }

        /* Right Control Panel */
        .live-right-panel { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        .balls-row { display: flex; gap: 6px; align-items: center; overflow-x: auto; padding: 4px 0; }
        .ball-chip { width: 34px; height: 34px; border-radius: 50%; font-size: 0.72rem; font-weight: 900; color: #ffffff; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,0.4); flex-shrink: 0; }
        .ball-chip.n-ball { background: var(--green-accent); }
        .ball-chip.b-ball { background: var(--red-accent); }
        .ball-chip.g-ball { background: var(--yellow-accent); color: #000; }

        .auto-switch-row { display: flex; align-items: center; justify-content: flex-end; gap: 8px; font-size: 0.7rem; font-weight: 800; color: var(--red-accent); }
        .switch-bg { width: 36px; height: 20px; background: var(--cyan-accent); border-radius: 10px; position: relative; }
        .switch-knob { width: 16px; height: 16px; background: #ffffff; border-radius: 50%; position: absolute; right: 2px; top: 2px; }

        .amharic-info-box { background: #0f172a; border: 1px dashed var(--border-color); border-radius: 8px; padding: 10px; color: #cbd5e1; font-size: 0.75rem; line-height: 1.4; text-align: left; }
        .my-selected-count-txt { color: var(--red-accent); font-size: 1.2rem; font-weight: 900; margin-top: 10px; text-align: center; }

        .live-footer { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .btn-refresh-big { width: 100%; background: var(--cyan-accent); color: #000000; font-weight: 900; border: none; padding: 8px; border-radius: 8px; font-size: 0.85rem; cursor: pointer; }
        .game-id-txt { color: var(--text-muted); font-size: 0.65rem; font-weight: 700; }

        /* Winner Modal */
        #winner-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        .modal-card { background: #111e33; border: 2px solid #334155; border-radius: 16px; padding: 16px; width: 88%; max-width: 310px; text-align: center; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
        .win-title { font-size: 1.5rem; font-weight: 900; color: #ffffff; letter-spacing: 1px; margin-bottom: 6px; }
        .win-player-pill { background: var(--green-accent); color: #ffffff; padding: 4px 12px; border-radius: 12px; font-size: 0.75rem; font-weight: 800; display: inline-block; margin-bottom: 12px; }

        .win-grid-container { background: #1e293b; border-radius: 12px; padding: 8px; margin-bottom: 10px; }
        .win-header-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; font-weight: 900; font-size: 0.85rem; margin-bottom: 6px; }
        .win-grid-5x5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
        .win-cell { font-size: 0.75rem; font-weight: 800; padding: 6px 0; border-radius: 4px; color: #ffffff; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; }
        .win-cell.hit { background: var(--green-accent); }
        .win-cell.miss { background: var(--red-accent); }

        .win-card-footer { display: flex; justify-content: space-between; font-size: 0.78rem; font-weight: 800; color: #22c55e; margin-top: 6px; }
        .win-countdown-txt { color: var(--red-accent); font-size: 1rem; font-weight: 900; margin-top: 10px; }
        .win-progress-bar { width: 100%; height: 4px; background: #334155; border-radius: 2px; overflow: hidden; margin-top: 4px; }
        .win-progress-fill { width: 100%; height: 100%; background: #22c55e; }
    </style>
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="splash-logo-container">
            <div class="splash-crown">👑</div>
            <div class="splash-title">JOB BINGO</div>
            <div class="splash-sub">Get ready to play!</div>
            <div class="splash-progress-bg">
                <div id="splash-bar" class="splash-progress-fill"></div>
            </div>
        </div>
    </div>

    <!-- Top Navigation -->
    <div class="top-header">
        <button class="btn-refresh-sm" onclick="fetchState()">REFRESH</button>
        <div class="header-balance">BALANCE: <span>0 ETB</span></div>
        <div class="header-amharic-badge">ማታ ማታ ከ2:30 ሰአት አለ!</div>
    </div>

    <!-- Status Header Bar -->
    <div class="status-header-bar">
        <div class="status-conn">CONNECTED</div>
        <div id="status-timer" class="status-timer">⏰ 45s</div>
        <div class="status-stake">Stake: <span>20 ETB</span></div>
        <div id="status-win-txt" class="status-win">Win: 0 ETB</div>
    </div>

    <!-- 1-500 Selection Section -->
    <div id="pick-section">
        <div id="grid-500" class="pick-grid-500"></div>
    </div>

    <!-- Live Game Section -->
    <div id="live-section" style="display: none;">
        <div class="live-layout">
            <!-- 1-75 Board -->
            <div class="matrix-board-vertical">
                <div class="matrix-v-headers">
                    <span class="mh-b">B</span>
                    <span class="mh-i">I</span>
                    <span class="mh-n">N</span>
                    <span class="mh-g">G</span>
                    <span class="mh-o">O</span>
                </div>
                <div id="matrix-v-cells" class="matrix-v-grid"></div>
            </div>

            <!-- Right Panel -->
            <div class="live-right-panel">
                <div id="balls-history-row" class="balls-row">
                    <div class="ball-chip n-ball">N37</div>
                    <div class="ball-chip b-ball">B7</div>
                    <div class="ball-chip b-ball">B2</div>
                    <div class="ball-chip g-ball">G54</div>
                </div>

                <div class="auto-switch-row">
                    <span>AUTO</span>
                    <div class="switch-bg"><div class="switch-knob"></div></div>
                </div>

                <div class="amharic-info-box">
                    የዚህ ዙር ጨዋታ ተጀምሯል:: አዲስ ዙር እስኪጀምር እዚህ ይጠበቁ::
                </div>

                <div id="my-cards-count-txt" class="my-selected-count-txt">0 ዝግ</div>

                <div class="live-footer">
                    <div class="header-amharic-badge" style="width: 100%; text-align: center;">ሁልጊዜ ማታ ማታ ከ2:30</div>
                    <button class="btn-refresh-big" onclick="fetchState()">REFRESH</button>
                    <div id="game-id-display" class="game-id-txt">GAME ID: 45866</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Winner Modal Overlay -->
    <div id="winner-modal">
        <div class="modal-card">
            <div class="win-title">BINGO!</div>
            <div id="win-player-name" class="win-player-pill">EDLAW (*2414) has won the game</div>

            <div class="win-grid-container">
                <div class="win-header-row">
                    <span class="mh-b">B</span>
                    <span class="mh-i">I</span>
                    <span class="mh-n">N</span>
                    <span class="mh-g">G</span>
                    <span class="mh-o">O</span>
                </div>
                <div id="win-card-grid-5x5" class="win-grid-5x5"></div>
                <div class="win-card-footer">
                    <span id="win-prize-txt">Prize: 1344 ETB</span>
                    <span id="win-card-id-txt">Card# 111</span>
                </div>
            </div>

            <div id="win-timer-val" class="win-countdown-txt">4s</div>
            <div class="win-progress-bar">
                <div id="win-progress-fill" class="win-progress-fill"></div>
            </div>
        </div>
    </div>

    <script>
        let tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
        let userId = tgUser ? 'tg_' + tgUser.id : localStorage.getItem('bingo_user_id');
        
        if (!userId) {
            userId = 'user_' + Math.floor(Math.random() * 89999 + 10000);
            localStorage.setItem('bingo_user_id', userId);
        }

        let userName = tgUser ? (tgUser.first_name || 'Player') : 'aemro (*9025)';
        let selectedCards = {};

        // Run Splash animation on load
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => { document.getElementById('splash-bar').style.width = '100%'; }, 100);
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 400);
            }, 1400);
        });

        // Initialize 1-75 vertical board layout
        function initVerticalMatrixBoard() {
            const container = document.getElementById('matrix-v-cells');
            container.innerHTML = '';
            for (let r = 0; r < 15; r++) {
                for (let c = 0; c < 5; c++) {
                    const num = (c * 15) + (r + 1);
                    const cell = document.createElement('div');
                    const colClass = c === 0 ? 'col-b' : c === 1 ? 'col-i' : c === 2 ? 'col-n' : c === 3 ? 'col-g' : 'col-o';
                    cell.className = `mv-cell ${colClass}`;
                    cell.id = `mv-cell-${num}`;
                    cell.innerText = num;
                    container.appendChild(cell);
                }
            }
        }

        // Initialize 1-500 picking tiles grid
        function init500PickGrid() {
            const container = document.getElementById('grid-500');
            container.innerHTML = '';
            for (let i = 1; i <= 500; i++) {
                const tile = document.createElement('div');
                tile.className = 'pick-tile';
                tile.id = `pick-tile-${i}`;
                tile.innerText = i;
                tile.onclick = () => selectCard(i);
                container.appendChild(tile);
            }
        }

        async function selectCard(cardId) {
            try {
                const tile = document.getElementById(`pick-tile-${cardId}`);
                if (tile) tile.classList.toggle('selected');

                const res = await fetch('/api/game/select-card', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cardId, userId, userName })
                });
                const data = await res.json();
                if (data.success) {
                    selectedCards = data.userCards || {};
                    updatePickedCardHighlights();
                } else if (data.message) {
                    alert(data.message);
                    fetchState();
                }
            } catch (e) {
                console.error(e);
            }
        }

        function updatePickedCardHighlights() {
            let myCardIds = new Set();
            for (let k in selectedCards) {
                if (String(selectedCards[k].ownerId) === String(userId)) {
                    myCardIds.add(Number(selectedCards[k].cardId));
                }
            }

            for (let i = 1; i <= 500; i++) {
                const tile = document.getElementById(`pick-tile-${i}`);
                if (tile) {
                    if (myCardIds.has(i)) {
                        tile.classList.add('selected');
                    } else {
                        tile.classList.remove('selected');
                    }
                }
            }

            document.getElementById('my-cards-count-txt').innerText = `${myCardIds.size} ዝግ`;
        }

        function updateVerticalMatrixBoard(calledNumbers) {
            const calledSet = new Set((calledNumbers || []).map(n => Number(n)));
            for (let i = 1; i <= 75; i++) {
                const el = document.getElementById(`mv-cell-${i}`);
                if (el) {
                    if (calledSet.has(i)) {
                        el.classList.add('called');
                    } else {
                        el.classList.remove('called');
                    }
                }
            }
        }

        async function fetchState() {
            try {
                const res = await fetch('/api/game/state?t=' + Date.now());
                const data = await res.json();

                document.getElementById('status-timer').innerText = `⏰ ${data.timer || 0}s`;
                document.getElementById('status-win-txt').innerText = `Win: ${data.derash || 0} ETB`;
                document.getElementById('game-id-display').innerText = `GAME ID: ${data.gameId || 45866}`;

                const pickSec = document.getElementById('pick-section');
                const liveSec = document.getElementById('live-section');

                if (data.status === 'WAITING' || data.status === 'STARTING') {
                    pickSec.style.display = 'block';
                    liveSec.style.display = 'none';
                    document.getElementById('winner-modal').style.display = 'none';
                } else if (data.status === 'PLAYING' || data.status === 'WINNER') {
                    pickSec.style.display = 'none';
                    liveSec.style.display = 'block';
                }

                selectedCards = data.userCards || {};
                updatePickedCardHighlights();
                updateVerticalMatrixBoard(data.calledNumbers);

                if (data.status === 'WINNER' && data.winner) {
                    renderWinnerModal(data.winner, data.calledNumbers || [], data.timer);
                } else {
                    document.getElementById('winner-modal').style.display = 'none';
                }
            } catch (err) {
                console.error(err);
            }
        }

        function renderWinnerModal(winner, calledNumbers, timer) {
            document.getElementById('win-player-name').innerText = `${winner.player || 'Player'} has won the game`;
            document.getElementById('win-prize-txt').innerText = `Prize: ${winner.prize || 0} ETB`;
            document.getElementById('win-card-id-txt').innerText = `Card# ${winner.cardId || 1}`;
            document.getElementById('win-timer-val').innerText = `${timer}s`;

            const grid = document.getElementById('win-card-grid-5x5');
            grid.innerHTML = '';

            const calledSet = new Set((calledNumbers || []).map(n => String(n)));

            if (winner.cardMatrix && Array.isArray(winner.cardMatrix)) {
                for (let r = 0; r < 5; r++) {
                    for (let c = 0; c < 5; c++) {
                        const val = String(winner.cardMatrix[r][c]);
                        const cell = document.createElement('div');
                        cell.className = 'win-cell';
                        if (val === 'FREE' || val === 'F') {
                            cell.className += ' hit';
                            cell.innerText = 'F';
                        } else if (calledSet.has(val)) {
                            cell.className += ' hit';
                            cell.innerText = val;
                        } else {
                            cell.className += ' miss';
                            cell.innerText = val;
                        }
                        grid.appendChild(cell);
                    }
                }
            }
            document.getElementById('winner-modal').style.display = 'flex';
        }

        initVerticalMatrixBoard();
        init500PickGrid();
        setInterval(fetchState, 1000);
        fetchState();
    </script>
</body>
</html>
