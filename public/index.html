<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Best Bingo</title>
    <style>
        :root {
            --bg-dark: #070c18;
            --card-bg: #121b2d;
            --border-color: #1e293b;
            --primary-blue: #0284c7;
            --cyan-accent: #00bfff;
            --green-accent: #22c55e;
            --yellow-accent: #eab308;
            --red-accent: #ef4444;
            --purple-accent: #a855f7;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
        body { background-color: var(--bg-dark); color: #ffffff; padding: 10px; max-width: 480px; margin: 0 auto; }

        .logo-header { text-align: center; margin-bottom: 8px; }
        .logo-header img { width: 100%; max-width: 220px; border-radius: 8px; object-fit: contain; }

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 4px; }
        .btn-refresh { background: transparent; color: var(--cyan-accent); border: 1.5px solid var(--cyan-accent); padding: 5px 12px; border-radius: 6px; font-weight: 700; font-size: 0.75rem; cursor: pointer; }
        .balance-txt { color: var(--green-accent); font-weight: 800; font-size: 0.85rem; }
        .amharic-badge { background: #513607; color: #fde047; padding: 4px 8px; border-radius: 6px; font-size: 0.68rem; font-weight: 700; border: 1px solid #714b08; }

        .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
        .stat-box { background: var(--card-bg); border: 1px solid var(--border-color); padding: 6px 2px; border-radius: 8px; text-align: center; }
        .stat-label { font-size: 0.65rem; color: var(--text-muted); margin-bottom: 2px; }
        .stat-val { font-size: 0.82rem; font-weight: 800; color: #ffffff; }

        /* Automatic Mode Indicator Banner */
        .mode-banner { background: var(--card-bg); border: 1.5px solid var(--primary-blue); color: #ffffff; padding: 10px; border-radius: 8px; font-weight: 800; font-size: 0.85rem; text-align: center; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .mode-title { color: var(--cyan-accent); }
        .mode-timer { color: var(--yellow-accent); }

        /* Compact Tile Picker Grid */
        .pick-tiles-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; max-height: 240px; overflow-y: auto; padding: 6px; background: #0b1322; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 12px; }
        .card-tile { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 10px 2px; text-align: center; font-size: 0.75rem; font-weight: 800; color: var(--cyan-accent); cursor: pointer; }
        .card-tile.selected { background: var(--primary-blue); color: #ffffff; border-color: var(--cyan-accent); box-shadow: 0 0 8px rgba(0, 191, 255, 0.4); }

        .section-title { font-size: 0.82rem; font-weight: 800; color: var(--green-accent); margin: 10px 0 8px; text-transform: uppercase; text-align: left; display: flex; justify-content: space-between; align-items: center; }

        /* Live Board Layout */
        .live-container { display: flex; gap: 10px; margin-bottom: 12px; align-items: flex-start; justify-content: space-between; }
        .matrix-board { background: var(--card-bg); border: 1px solid var(--border-color); padding: 6px; border-radius: 8px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; flex: 1.3; }
        .matrix-header { font-size: 0.7rem; font-weight: 900; text-align: center; padding: 2px 0; }
        .mh-b { color: #ef4444; } .mh-i { color: #38bdf8; } .mh-n { color: #f59e0b; } .mh-g { color: #22c55e; } .mh-o { color: #a855f7; }
        .matrix-cell { font-size: 0.68rem; padding: 3px 0; background: #1a2436; color: #64748b; border-radius: 2px; font-weight: 700; text-align: center; }
        .matrix-cell.called { background: var(--primary-blue); color: #ffffff; font-weight: 900; }

        .ball-display-container { flex: 0.9; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 15px; }
        .ball-circle { width: 80px; height: 80px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #fef08a, #eab308, #ca8a04); border: 3px solid #fef08a; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; font-weight: 900; color: #000000; box-shadow: 0 0 20px rgba(234, 179, 8, 0.5); margin-bottom: 10px; }
        .auto-toggle { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; font-weight: 800; color: var(--green-accent); }
        .toggle-switch { background: var(--green-accent); width: 32px; height: 18px; border-radius: 10px; position: relative; display: inline-block; }
        .toggle-knob { background: #ffffff; width: 14px; height: 14px; border-radius: 50%; position: absolute; right: 2px; top: 2px; }

        /* 2-Column Bingo Cards Layout */
        .cards-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .card-container { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 6px; }
        .card-container.selected { border-color: var(--primary-blue); box-shadow: 0 0 10px rgba(2, 132, 199, 0.3); }
        .card-title { color: var(--cyan-accent); font-size: 0.75rem; font-weight: 800; text-align: center; margin-bottom: 5px; }
        
        .b-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
        .b-cell { background: #1a2436; color: #cbd5e1; font-size: 0.65rem; font-weight: 700; padding: 5px 0; border-radius: 3px; display: flex; align-items: center; justify-content: center; aspect-ratio: 1; }
        .b-cell.free { background: var(--yellow-accent); color: #000000; font-weight: 900; font-size: 0.55rem; }
        .b-cell.called { background: var(--primary-blue); color: #ffffff; font-weight: 800; }

        .empty-msg { color: var(--text-muted); font-size: 0.8rem; text-align: center; padding: 15px; border: 1px dashed var(--border-color); border-radius: 8px; width: 100%; grid-column: span 2; }

        /* Winner Modal Pop-up */
        #winner-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.88); backdrop-filter: blur(5px); flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        .modal-box { background: var(--card-bg); border: 2px solid var(--purple-accent); border-radius: 14px; padding: 16px; width: 88%; max-width: 320px; text-align: center; box-shadow: 0 0 25px rgba(168, 85, 247, 0.5); }
        .win-heading { color: #ffffff; font-size: 1.3rem; font-weight: 900; margin-bottom: 6px; }
        .win-badge { background: var(--green-accent); color: #ffffff; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 800; margin-bottom: 10px; display: inline-block; }
        
        .win-headers { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 4px; font-weight: 900; font-size: 0.85rem; }
        .win-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 12px; }
        .win-cell { font-size: 0.75rem; font-weight: 800; padding: 6px 0; border-radius: 4px; color: #ffffff; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; }
        .win-cell.hit { background: var(--green-accent); }
        .win-cell.miss { background: var(--red-accent); }

        .win-footer { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 800; color: var(--green-accent); margin-bottom: 6px; padding: 0 4px; }
        .win-next { color: var(--yellow-accent); font-size: 0.8rem; font-weight: 800; }
    </style>
</head>
<body>

    <!-- Logo Display -->
    <div class="logo-header">
        <img src="/logo.png" alt="Bingo Logo" onerror="this.style.display='none'">
    </div>

    <!-- Top Bar -->
    <div class="top-bar">
        <button class="btn-refresh" onclick="fetchState()">REFRESH</button>
        <span class="balance-txt">BALANCE: 0 ETB</span>
        <span class="amharic-badge">ስአት ገላዉ 1000 ሶስ አ</span>
    </div>

    <!-- Stat Grid -->
    <div class="stat-grid">
        <div class="stat-box">
            <div class="stat-label">Derash</div>
            <div id="stat-derash" class="stat-val">0 ETB</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Players</div>
            <div id="stat-players" class="stat-val">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Stake</div>
            <div class="stat-val">10 ETB</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Call</div>
            <div id="stat-call" class="stat-val">0/75</div>
        </div>
    </div>

    <!-- Automatic Mode Indicator -->
    <div class="mode-banner">
        <span id="mode-title" class="mode-title">Pick Cards (1-500)</span>
        <span id="mode-timer" class="mode-timer">45s</span>
    </div>

    <!-- PICK MODE SECTION -->
    <div id="pick-section">
        <div id="tiles-container" class="pick-tiles-grid"></div>
        <div class="section-title">
            <span>MY SELECTED CARDS</span>
            <span id="selected-count-badge" style="color:#00bfff; font-size:0.75rem;">(0)</span>
        </div>
        <div id="picked-cards-container" class="cards-grid"></div>
    </div>

    <!-- LIVE GAME SECTION -->
    <div id="live-section" style="display: none;">
        <div class="live-container">
            <div class="matrix-board">
                <div class="matrix-header mh-b">B</div>
                <div class="matrix-header mh-i">I</div>
                <div class="matrix-header mh-n">N</div>
                <div class="matrix-header mh-g">G</div>
                <div class="matrix-header mh-o">O</div>
                <div id="matrix-cells-container" style="display: contents;"></div>
            </div>
            <div class="ball-display-container">
                <div id="current-ball" class="ball-circle">--</div>
                <div class="auto-toggle">AUTO <span class="toggle-switch"><span class="toggle-knob"></span></span></div>
            </div>
        </div>
        <div id="live-cards-container" class="cards-grid"></div>
    </div>

    <!-- Winner Pop-up Modal -->
    <div id="winner-modal">
        <div class="modal-box">
            <div class="win-heading">🏆 BINGO!</div>
            <div id="win-player-badge" class="win-badge">aemro (*9025) won!</div>
            
            <div class="win-headers">
                <span class="mh-b">B</span>
                <span class="mh-i">I</span>
                <span class="mh-n">N</span>
                <span class="mh-g">G</span>
                <span class="mh-o">O</span>
            </div>
            
            <div id="win-card-grid" class="win-grid"></div>

            <div class="win-footer">
                <span id="win-prize-txt">Prize: 0 ETB</span>
                <span id="win-card-txt">Card# --</span>
            </div>
            <div id="win-timer-txt" class="win-next">Next Game in: 8s</div>
        </div>
    </div>

    <script>
        const userId = 'user_' + Math.floor(Math.random() * 8999 + 1000);
        let selectedCards = {};

        function initMatrixBoard() {
            const container = document.getElementById('matrix-cells-container');
            container.innerHTML = '';
            for (let r = 0; r < 15; r++) {
                for (let c = 0; c < 5; c++) {
                    const num = (c * 15) + (r + 1);
                    const cell = document.createElement('div');
                    cell.className = 'matrix-cell';
                    cell.id = `matrix-cell-${num}`;
                    cell.innerText = num;
                    container.appendChild(cell);
                }
            }
        }

        async function selectCard(cardId) {
            try {
                const res = await fetch('/api/game/select-card', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cardId, userId, userName: 'aemro (*9025)' })
                });
                const data = await res.json();
                if (data.success) {
                    selectedCards = data.userCards || {};
                    fetchState();
                } else if (data.message) {
                    alert(data.message);
                }
            } catch (e) {
                console.error(e);
            }
        }

        function updateMatrixBoard(calledNumbers) {
            const calledSet = new Set((calledNumbers || []).map(n => Number(n)));
            for (let i = 1; i <= 75; i++) {
                const el = document.getElementById(`matrix-cell-${i}`);
                if (el) {
                    if (calledSet.has(i)) {
                        el.classList.add('called');
                    } else {
                        el.classList.remove('called');
                    }
                }
            }
        }

        function renderPickTiles() {
            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            let myCardIds = new Set();
            for (let k in selectedCards) {
                if (selectedCards[k].ownerId === userId) {
                    myCardIds.add(selectedCards[k].cardId);
                }
            }

            for (let i = 1; i <= 500; i++) {
                const tile = document.createElement('div');
                const isMine = myCardIds.has(i);
                tile.className = `card-tile ${isMine ? 'selected' : ''}`;
                tile.innerText = `Card ${i}`;
                tile.onclick = () => selectCard(i);
                container.appendChild(tile);
            }
        }

        function renderCardsList(calledNumbers) {
            const pickCardsContainer = document.getElementById('picked-cards-container');
            const liveCardsContainer = document.getElementById('live-cards-container');
            const badge = document.getElementById('selected-count-badge');

            pickCardsContainer.innerHTML = '';
            liveCardsContainer.innerHTML = '';

            const calledSet = new Set((calledNumbers || []).map(n => String(n)));
            let myCards = [];

            for (let k in selectedCards) {
                if (selectedCards[k].ownerId === userId) {
                    myCards.push(selectedCards[k]);
                }
            }

            badge.innerText = `(${myCards.length})`;

            if (myCards.length === 0) {
                pickCardsContainer.innerHTML = '<div class="empty-msg">No cards selected yet. Tap any Card Number above to pick!</div>';
                liveCardsContainer.innerHTML = '<div class="empty-msg">No cards selected for this round.</div>';
                return;
            }

            myCards.forEach(cardObj => {
                const cardDiv = document.createElement('div');
                cardDiv.className = 'card-container selected';

                let html = `<div class="card-title">Card #${cardObj.cardId}</div><div class="b-grid">`;
                const matrix = cardObj.matrix;

                for (let r = 0; r < 5; r++) {
                    for (let c = 0; c < 5; c++) {
                        const val = String(matrix[r][c]);
                        if (val === 'FREE' || val === 'F') {
                            html += `<div class="b-cell free">FREE</div>`;
                        } else if (calledSet.has(val)) {
                            html += `<div class="b-cell called">${val}</div>`;
                        } else {
                            html += `<div class="b-cell">${val}</div>`;
                        }
                    }
                }
                html += `</div>`;
                cardDiv.innerHTML = html;

                pickCardsContainer.appendChild(cardDiv);
                liveCardsContainer.appendChild(cardDiv.cloneNode(true));
            });
        }

        async function fetchState() {
            try {
                const res = await fetch('/api/game/state?t=' + Date.now());
                const data = await res.json();

                document.getElementById('stat-derash').innerText = `${data.derash || 0} ETB`;
                document.getElementById('stat-players').innerText = `${data.playerCount || 0}`;
                document.getElementById('stat-call').innerText = `${(data.calledNumbers || []).length}/75`;

                const modeTitle = document.getElementById('mode-title');
                const modeTimer = document.getElementById('mode-timer');
                const pickSec = document.getElementById('pick-section');
                const liveSec = document.getElementById('live-section');

                // AUTOMATIC VIEW SWITCHING ACCORDING TO GAME STATUS
                if (data.status === 'WAITING') {
                    modeTitle.innerText = 'Pick Cards (1-500)';
                    modeTimer.innerText = `${data.timer}s`;
                    pickSec.style.display = 'block';
                    liveSec.style.display = 'none';
                    document.getElementById('winner-modal').style.display = 'none';
                } else if (data.status === 'STARTING') {
                    modeTitle.innerText = 'Calculating Players...';
                    modeTimer.innerText = `${data.timer}s`;
                    pickSec.style.display = 'block';
                    liveSec.style.display = 'none';
                    document.getElementById('winner-modal').style.display = 'none';
                } else if (data.status === 'PLAYING') {
                    modeTitle.innerText = '🎮 LIVE GAME';
                    modeTimer.innerText = 'IN PROGRESS';
                    pickSec.style.display = 'none';
                    liveSec.style.display = 'block';
                    document.getElementById('winner-modal').style.display = 'none';
                } else if (data.status === 'WINNER') {
                    modeTitle.innerText = '🏆 ROUND FINISHED';
                    modeTimer.innerText = `${data.timer}s`;
                    pickSec.style.display = 'none';
                    liveSec.style.display = 'block';
                }

                if (data.currentBall) {
                    document.getElementById('current-ball').innerText = `${data.currentBall.letter}-${data.currentBall.number}`;
                } else {
                    document.getElementById('current-ball').innerText = '--';
                }

                selectedCards = data.userCards || {};
                updateMatrixBoard(data.calledNumbers);
                renderPickTiles();
                renderCardsList(data.calledNumbers);

                if (data.status === 'WINNER' && data.winner) {
                    renderWinnerModal(data.winner, data.calledNumbers || [], data.timer);
                }
            } catch (err) {
                console.error(err);
            }
        }

        function renderWinnerModal(winner, calledNumbers, timer) {
            document.getElementById('win-player-badge').innerText = `${winner.player || 'Player'} won!`;
            document.getElementById('win-prize-txt').innerText = `Prize: ${winner.prize || 10} ETB`;
            document.getElementById('win-card-txt').innerText = `Card# ${winner.cardId || 1}`;
            document.getElementById('win-timer-txt').innerText = `Next Game in: ${timer}s`;

            const grid = document.getElementById('win-card-grid');
            grid.innerHTML = '';

            const calledSet = new Set((calledNumbers || []).map(n => String(n)));

            if (winner.cardMatrix && Array.isArray(winner.cardMatrix)) {
                for (let r = 0; r < 5; r++) {
                    for (let c = 0; c < 5; c++) {
                        const val = String(winner.cardMatrix[r][c]);
                        const cell = document.createElement('div');
                        cell.className = 'win-cell';
                        if (val === 'FREE' || val === 'F') {
                            cell.className += ' hit';
                            cell.innerText = 'F';
                        } else if (calledSet.has(val)) {
                            cell.className += ' hit';
                            cell.innerText = val;
                        } else {
                            cell.className += ' miss';
                            cell.innerText = val;
                        }
                        grid.appendChild(cell);
                    }
                }
            }
            document.getElementById('winner-modal').style.display = 'flex';
        }

        initMatrixBoard();
        setInterval(fetchState, 1000);
        fetchState();
    </script>
</body>
</html>
