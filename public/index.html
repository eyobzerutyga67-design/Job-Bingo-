<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Bingo</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #121212; color: #ffffff; margin: 0; padding: 10px; text-align: center; }
        .logo { width: 100%; max-width: 180px; border-radius: 12px; margin: 0 auto 8px; display: block; box-shadow: 0 4px 15px rgba(255,100,0,0.3); }
        
        .status-bar { font-size: 0.85rem; color: #fff; background: #1e1e1e; padding: 8px; border-radius: 8px; border: 1px solid #333; margin-bottom: 8px; font-weight: bold; display: flex; justify-content: space-around; flex-wrap: wrap; gap: 5px; }
        .status-bar span { background: #2a2a2a; padding: 4px 8px; border-radius: 4px; border: 1px solid #444; }

        .current-ball { font-size: 2.2rem; font-weight: bold; margin: 6px 0; min-height: 48px; }

        .my-selection-bar { background: #0056b3; color: #fff; padding: 6px 10px; border-radius: 6px; font-weight: bold; font-size: 0.85rem; margin-bottom: 10px; }

        .caller-board-title { font-size: 0.8rem; font-weight: bold; color: #aaa; margin: 5px 0 3px; text-transform: uppercase; }
        .caller-board { display: grid; grid-template-columns: repeat(15, 1fr); gap: 2px; background: #1a1a1a; padding: 6px; border-radius: 8px; border: 1px solid #333; margin-bottom: 12px; }
        .ball-num { font-size: 0.65rem; padding: 4px 0; background: #262626; color: #666; border-radius: 2px; font-weight: bold; }
        .ball-num.called { background: #28a745; color: #ffffff; font-weight: bold; box-shadow: 0 0 5px rgba(40,167,69,0.8); }

        .card-picker-box { max-height: 220px; overflow-y: auto; background: #1a1a1a; padding: 8px; border-radius: 8px; border: 1px solid #333; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 15px; }
        .pick-btn { background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 6px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.8rem; }
        .pick-btn.selected { background: #28a745; border-color: #1e7e34; color: #fff; box-shadow: 0 0 8px rgba(40,167,69,0.7); }

        .bingo-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; max-width: 320px; margin: 0 auto 15px; }
        .b-header { font-weight: bold; padding: 6px 0; border-radius: 4px; color: #fff; font-size: 1rem; }
        .b-header.b-green { background: #28a745; }
        .b-header.b-yellow { background: #ffc107; color: #000; }
        .b-header.b-red { background: #dc3545; }
        .b-header.b-blue { background: #007bff; }

        .cell { background: #222; border: 1px solid #333; padding: 8px 0; font-weight: bold; font-size: 0.9rem; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
        .cell.called { background: #28a745; color: #fff; border-color: #1e7e34; font-weight: bold; }
        .cell.free { background: #ffc107; color: #000; font-weight: bold; }
        .cell.uncalled { background: #2a2a2a; color: #aaa; }

        #winner-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); flex-direction: column; justify-content: center; align-items: center; z-index: 999; }
        .modal-content { background: #1e1e1e; border: 1px solid #444; padding: 15px; border-radius: 10px; width: 92%; max-width: 340px; }
        .win-title { color: #28a745; font-size: 1.4rem; margin: 0 0 5px; }
    </style>
</head>
<body>

    <img src="/logo.png" alt="Job Bingo Logo" class="logo" onerror="this.style.display='none'">
    
    <div class="status-bar">
        <span id="stat-mode">WAITING</span>
        <span id="stat-players">👥 Players: 0</span>
        <span id="stat-cards">🎴 Cards: 0</span>
        <span id="stat-derash">💰 Prize: 0 ETB</span>
    </div>

    <div id="current-ball" class="current-ball">--</div>

    <div id="selection-summary" class="my-selection-bar">Your Picked Cards: None (Max 4)</div>

    <div class="caller-board-title">75 Ball Caller Board</div>
    <div id="caller-board" class="caller-board"></div>

    <div id="picker-container" class="card-picker-box"></div>
    
    <div id="active-cards-container"></div>

    <div id="winner-modal">
        <div class="modal-content">
            <h2 id="win-player-name" class="win-title">Player Won!</h2>
            <p id="win-prize" style="font-weight:bold; color:#00d2ff; margin: 4px 0;">Prize: 0 ETB</p>
            <p id="win-pattern" style="color:#ffc107; margin: 4px 0;">Pattern: --</p>
            <p id="win-card-id" style="margin: 4px 0;">Card #--</p>
            
            <div class="bingo-grid" style="margin-top: 8px;">
                <div class="b-header b-green">🟢 B</div>
                <div class="b-header b-yellow">🟡 I</div>
                <div class="b-header b-red">🔴 N</div>
                <div class="b-header b-blue">🔵 G</div>
                <div class="b-header b-green">🟢 O</div>
            </div>
            <div id="win-card-grid" class="bingo-grid"></div>
            
            <p id="win-timer" style="margin-top: 8px; color: #28a745; font-weight: bold;">Card Selection in: --s</p>
        </div>
    </div>

    <script>
        const userId = 'user_' + Math.floor(Math.random() * 8999 + 1000);
        let selectedCards = {};

        function initCallerBoard() {
            const board = document.getElementById('caller-board');
            board.innerHTML = '';
            for (let i = 1; i <= 75; i++) {
                const b = document.createElement('div');
                b.className = 'ball-num';
                b.id = `caller-ball-${i}`;
                b.innerText = i;
                board.appendChild(b);
            }
        }

        async function selectCard(cardId) {
            try {
                const res = await fetch('/api/game/select-card', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cardId, userId, userName: 'Player (' + userId.slice(-4) + ')' })
                });
                const data = await res.json();
                if (data.success) {
                    selectedCards = data.userCards || {};
                    fetchState();
                } else if (data.message) {
                    alert(data.message);
                }
            } catch (e) {
                console.error(e);
            }
        }

        function renderPickers() {
            const container = document.getElementById('picker-container');
            if (container.children.length === 0) {
                for (let i = 1; i <= 500; i++) {
                    const btn = document.createElement('button');
                    btn.className = 'pick-btn';
                    btn.id = `pick-btn-${i}`;
                    btn.innerText = `#${i}`;
                    btn.onclick = () => selectCard(i);
                    container.appendChild(btn);
                }
            }

            const mySelectedIds = [];
            for (let k in selectedCards) {
                if (selectedCards[k].ownerId === userId) {
                    mySelectedIds.push(selectedCards[k].cardId);
                }
            }

            const mySet = new Set(mySelectedIds);

            for (let i = 1; i <= 500; i++) {
                const btn = document.getElementById(`pick-btn-${i}`);
                if (btn) {
                    if (mySet.has(i)) {
                        btn.classList.add('selected');
                        btn.innerText = `✓ #${i}`;
                    } else {
                        btn.classList.remove('selected');
                        btn.innerText = `#${i}`;
                    }
                }
            }

            const summary = document.getElementById('selection-summary');
            if (mySelectedIds.length > 0) {
                summary.innerText = `Your Selected Cards (${mySelectedIds.length}/4): ` + mySelectedIds.map(id => `#${id}`).join(', ');
            } else {
                summary.innerText = `Your Picked Cards: None (Max 4 per player)`;
            }
        }

        function updateCallerBoard(calledNumbers) {
            const calledSet = new Set((calledNumbers || []).map(n => Number(n)));
            for (let i = 1; i <= 75; i++) {
                const b = document.getElementById(`caller-ball-${i}`);
                if (b) {
                    if (calledSet.has(i)) {
                        b.classList.add('called');
                    } else {
                        b.classList.remove('called');
                    }
                }
            }
        }

        function renderPlayerCards(calledNumbers) {
            const container = document.getElementById('active-cards-container');
            container.innerHTML = '';

            const calledSet = new Set((calledNumbers || []).map(n => String(n)));

            for (let k in selectedCards) {
                if (selectedCards[k].ownerId !== userId) continue;

                const cardObj = selectedCards[k];
                const matrix = cardObj.matrix;
                const cardDiv = document.createElement('div');
                cardDiv.style.marginBottom = '15px';

                let html = `<h3 style="margin:5px 0; color:#28a745;">Card #${cardObj.cardId}</h3>`;
                html += `<div class="bingo-grid">
                            <div class="b-header b-green">🟢 B</div>
                            <div class="b-header b-yellow">🟡 I</div>
                            <div class="b-header b-red">🔴 N</div>
                            <div class="b-header b-blue">🔵 G</div>
                            <div class="b-header b-green">🟢 O</div>`;

                for (let r = 0; r < 5; r++) {
                    for (let c = 0; c < 5; c++) {
                        const val = String(matrix[r][c]);
                        if (val === 'FREE' || val === 'F') {
                            html += `<div class="cell free">FREE</div>`;
                        } else if (calledSet.has(val)) {
                            html += `<div class="cell called">${val}</div>`;
                        } else {
                            html += `<div class="cell uncalled">${val}</div>`;
                        }
                    }
                }
                html += `</div>`;
                cardDiv.innerHTML = html;
                container.appendChild(cardDiv);
            }
        }

        async function fetchState() {
            try {
                const res = await fetch('/api/game/state?t=' + Date.now());
                const data = await res.json();

                document.getElementById('stat-players').innerText = `👥 Players: ${data.playerCount || 0}`;
                document.getElementById('stat-cards').innerText = `🎴 Cards: ${data.totalCards || 0}`;
                document.getElementById('stat-derash').innerText = `💰 Derash: ${data.derash || 0} ETB`;

                const pickerContainer = document.getElementById('picker-container');

                if (data.status === 'WAITING') {
                    document.getElementById('stat-mode').innerText = `PICK CARDS (${data.timer}s)`;
                    pickerContainer.style.display = 'flex';
                } else if (data.status === 'STARTING') {
                    document.getElementById('stat-mode').innerText = `STARTING (${data.timer}s)`;
                    pickerContainer.style.display = 'none';
                } else if (data.status === 'PLAYING') {
                    document.getElementById('stat-mode').innerText = `LIVE GAME`;
                    pickerContainer.style.display = 'none';
                } else if (data.status === 'WINNER') {
                    document.getElementById('stat-mode').innerText = `GAME OVER`;
                    pickerContainer.style.display = 'none';
                }

                if (data.currentBall) {
                    const colorMap = { green: '#28a745', yellow: '#ffc107', red: '#dc3545', blue: '#007bff' };
                    const bColor = colorMap[data.currentBall.color] || '#00d2ff';
                    document.getElementById('current-ball').innerHTML = `<span style="color:${bColor}">${data.currentBall.letter}-${data.currentBall.number}</span>`;
                } else {
                    document.getElementById('current-ball').innerText = '--';
                }

                selectedCards = data.userCards || {};
                renderPickers();
                updateCallerBoard(data.calledNumbers);
                renderPlayerCards(data.calledNumbers);

                if (data.status === 'WINNER' && data.winner) {
                    renderWinnerModal(data.winner, data.calledNumbers || [], data.timer);
                } else {
                    document.getElementById('winner-modal').style.display = 'none';
                }
            } catch (err) {
                console.error(err);
            }
        }

        function renderWinnerModal(winner, calledNumbers, timer) {
            document.getElementById('win-player-name').innerText = `${winner.player} WON!`;
            document.getElementById('win-prize').innerText = `Prize: ${winner.prize} ETB`;
            document.getElementById('win-pattern').innerText = `Won by: ${winner.winPattern}`;
            document.getElementById('win-card-id').innerText = `Card #${winner.cardId}`;
            document.getElementById('win-timer').innerText = `Card Selection in: ${timer}s`;

            const grid = document.getElementById('win-card-grid');
            grid.innerHTML = '';

            const calledSet = new Set((calledNumbers || []).map(n => String(n)));

            if (winner.cardMatrix && Array.isArray(winner.cardMatrix)) {
                for (let r = 0; r < 5; r++) {
                    for (let c = 0; c < 5; c++) {
                        const val = String(winner.cardMatrix[r][c]);
                        const cell = document.createElement('div');
                        if (val === 'FREE' || val === 'F') {
                            cell.className = 'cell free';
                            cell.innerText = 'FREE';
                        } else if (calledSet.has(val)) {
                            cell.className = 'cell called';
                            cell.innerText = val;
                        } else {
                            cell.className = 'cell uncalled';
                            cell.innerText = val;
                        }
                        grid.appendChild(cell);
                    }
                }
            }
            document.getElementById('winner-modal').style.display = 'flex';
        }

        initCallerBoard();
        setInterval(fetchState, 1000);
        fetchState();
    </script>
</body>
</html>
