<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Bingo</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 10px; text-align: center; }
        .card-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; max-width: 350px; margin: 10px auto; }
        .cell { background: #222; border: 1px solid #444; padding: 12px 0; font-weight: bold; border-radius: 4px; }
        .cell.called { background: #28a745; color: #fff; }
        .cell.free { background: #ffc107; color: #000; }
        .cell.uncalled { background: #333; color: #888; }
        #winner-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); flex-direction: column; justify-content: center; align-items: center; }
        .modal-content { background: #1e1e1e; padding: 20px; border-radius: 8px; max-width: 90%; }
    </style>
</head>
<body>

    <h1>JOB BINGO</h1>
    <div id="status-display">Loading...</div>
    <div id="current-ball" style="font-size: 2rem; margin: 10px; color: #00d2ff;">--</div>
    
    <div id="board" class="card-grid"></div>

    <div id="winner-modal">
        <div class="modal-content">
            <h2 id="win-player-name">Player Won!</h2>
            <p id="win-prize">Prize: 0 ETB</p>
            <p id="win-card-id">Card #--</p>
            <div id="win-card-grid" class="card-grid"></div>
            <p id="win-timer">Next Game in: --s</p>
        </div>
    </div>

    <script>
        let currentState = null;

        async function fetchState() {
            try {
                const res = await fetch('/api/game/state');
                const data = await res.json();
                currentState = data;

                document.getElementById('status-display').innerText = `Status: ${data.status} | Timer: ${data.timer}s | Derash: ${data.derash} ETB`;
                if (data.currentBall) {
                    document.getElementById('current-ball').innerText = `${data.currentBall.letter}-${data.currentBall.number}`;
                }

                if (data.status === 'WINNER' && data.winner) {
                    renderWinnerModal(data.winner, data.calledNumbers || [], data.timer);
                } else {
                    document.getElementById('winner-modal').style.display = 'none';
                }
            } catch (err) {
                console.error(err);
            }
        }

        function renderWinnerModal(winner, calledNumbers, timer) {
            document.getElementById('win-player-name').innerText = `${winner.player} WON!`;
            document.getElementById('win-prize').innerText = `Prize: ${winner.prize} ETB`;
            document.getElementById('win-card-id').innerText = `Card# ${winner.cardId}`;
            document.getElementById('win-timer').innerText = `Next Game in: ${timer}s`;

            const grid = document.getElementById('win-card-grid');
            grid.innerHTML = '';

            const calledSet = new Set((calledNumbers || []).map(n => String(n)));

            if (winner.cardMatrix && Array.isArray(winner.cardMatrix)) {
                for (let r = 0; r < 5; r++) {
                    for (let c = 0; c < 5; c++) {
                        const val = winner.cardMatrix[r][c];
                        const cell = document.createElement('div');
                        
                        const strVal = String(val);
                        if (strVal === 'FREE' || strVal === 'F') {
                            cell.className = 'cell free';
                            cell.innerText = 'F';
                        } else if (calledSet.has(strVal)) {
                            cell.className = 'cell called';
                            cell.innerText = strVal;
                        } else {
                            cell.className = 'cell uncalled';
                            cell.innerText = strVal;
                        }
                        grid.appendChild(cell);
                    }
                }
            }
            document.getElementById('winner-modal').style.display = 'flex';
        }

        setInterval(fetchState, 1000);
        fetchState();
    </script>
</body>
</html>
